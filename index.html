<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Современный Магазин</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .admin-link:hover {
      background: var(--card-bg);
      color: var(--text);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
      width: 100%;
      flex-grow: 1;
    }
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
    }
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0f172a;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .card-price {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: auto;
    }
    .loader, .empty-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 48px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">STORE.</div>
    <a href="admin.html" class="admin-link">Админ-панель</a>
  </header>

  <main>
    <div id="catalog" class="catalog">
      <div class="loader">Загрузка товаров...</div>
    </div>
  </main>

  <script>
    // @ts-nocheck
    const SUPABASE_URL = "https://gokwvpvsqaqzfhfbxst.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dTIamntMhVMibTAbfHFblQ_dKSSnBGh";

    var storeClient = window.storeClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProducts() {
      const catalogEl = document.getElementById('catalog');
      
      try {
        const { data, error } = await storeClient.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;

        if (!data || data.length === 0) {
          catalogEl.innerHTML = '<div class="empty-msg">Каталог пока пуст. Добавьте товары через админ-панель.</div>';
          return;
        }

        catalogEl.innerHTML = data.map(item => `
          <div class="card">
            <div class="card-img-wrapper">
              <img class="card-img" src="${item.image_url}" alt="${item.title}" loading="lazy">
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-price">${item.price}</div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        catalogEl.innerHTML = `<div class="empty-msg" style="color: #ef4444;">Ошибка загрузки каталога: ${err.message}</div>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>
