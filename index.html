<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK STORE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent: #ffffff;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border-color: #222222;
            --danger: #ff4d4d;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 11, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent);
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: var(--bg-color);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            flex: 1;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #444;
        }

        .product-img-container {
            width: 100%;
            height: 320px;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .product-img-container img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--accent);
        }

        /* Детали товара */
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
            }
        }

        .detail-gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .detail-info h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .detail-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .detail-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .sizes-container {
            margin-bottom: 20px;
        }

        .sizes-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .sizes-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .size-btn.active {
            background: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Админ панель */
        .admin-form input, .admin-form textarea, .admin-form select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .admin-form label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Корзина */
        .cart-item {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cart-item-details {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .cart-item-price {
            font-weight: 700;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">BLACK STORE</a>
        <div class="header-actions">
            <button class="icon-btn" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i></button>
            <button class="icon-btn" onclick="openCartModal()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('all', this)">Все</button>
            <button class="filter-btn" onclick="filterProducts('clothes', this)">Одежда</button>
            <button class="filter-btn" onclick="filterProducts('shoes', this)">Обувь</button>
            <button class="filter-btn" onclick="filterProducts('accessories', this)">Аксессуары</button>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Товары рендерятся через JS -->
        </div>
    </div>

    <!-- Модальное окно товара -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('product-modal')">&times;</button>
            <div id="product-modal-body">
                <!-- Контент товара -->
            </div>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('cart-modal')">&times;</button>
            <h2 style="margin-bottom: 20px;">Корзина</h2>
            <div id="cart-items-container">
                <!-- Товары в корзине -->
            </div>
            <div id="cart-total" style="font-weight: 700; font-size: 1.2rem; margin: 20px 0;">Итого: 0 ₸</div>
            <button class="btn-primary" onclick="checkout()">Оформить заказ в Telegram</button>
        </div>
    </div>

    <!-- Модальное окно админки -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('admin-modal')">&times;</button>
            <h2 style="margin-bottom: 20px;">Добавить товар</h2>
            <div class="admin-form">
                <label>Название товара</label>
                <input type="text" id="admin-title" placeholder="Худи Black Style">
                
                <label>Категория</label>
                <select id="admin-category">
                    <option value="clothes">Одежда</option>
                    <option value="shoes">Обувь</option>
                    <option value="accessories">Аксессуары</option>
                </select>

                <label>Цена (₸)</label>
                <input type="number" id="admin-price" placeholder="25000">

                <label>Размеры (через запятую)</label>
                <input type="text" id="admin-sizes" placeholder="S, M, L, XL">

                <label>Ссылка на фото</label>
                <input type="text" id="admin-img" placeholder="https://...">

                <label>Описание</label>
                <textarea id="admin-desc" rows="3" placeholder="Описание товара..."></textarea>

                <button class="btn-primary" onclick="addNewProduct()">Добавить товар</button>
            </div>
        </div>
    </div>

    <script>
        // СЮДА ПИШИТЕ ВАШИ ТОВАРЫ ПО УМОЛЧАНИЮ (они больше не застрянут в памяти)
        function getProducts() {
            const stored = localStorage.getItem('black_store_products');
            if (stored) {
                return JSON.parse(stored);
            }
            
            return [
                {
                    id: 1,
                    title: "Худи Oversize",
                    category: "clothes",
                    sizes: "S, M, L, XL",
                    price: 24900,
                    desc: "Плотное брендовое худи оверсайз кроя.",
                    img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&q=80&w=800"
                },
                {
                    id: 2,
                    title: "Кроссовки Street",
                    category: "shoes",
                    sizes: "41, 42, 43, 44",
                    price: 39900,
                    desc: "Стильные городские кроссовки.",
                    img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=800"
                }
            ];
        }

        let products = getProducts();
        let cart = JSON.parse(localStorage.getItem('black_store_cart')) || [];
        let currentSelectedSize = '';

        function saveProducts() {
            localStorage.setItem('black_store_products', JSON.stringify(products));
        }

        function renderProducts(items) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);">Товары не найдены</p>';
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openProductModal(product.id);
                
                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${product.img}" alt="${product.title}" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price.toLocaleString()} ₸</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (category === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const sizesArray = product.sizes ? product.sizes.split(',').map(s => s.trim()) : [];
            currentSelectedSize = sizesArray[0] || '';

            const body = document.getElementById('product-modal-body');
            body.innerHTML = `
                <div class="product-detail-grid">
                    <div class="detail-gallery">
                        <img src="${product.img}" alt="${product.title}">
                    </div>
                    <div class="detail-info">
                        <h2>${product.title}</h2>
                        <div class="detail-price">${product.price.toLocaleString()} ₸</div>
                        <div class="detail-desc">${product.desc || ''}</div>
                        
                        ${sizesArray.length > 0 ? `
                            <div class="sizes-container">
                                <div class="sizes-title">Выберите размер:</div>
                                <div class="sizes-list">
                                    ${sizesArray.map((size, index) => `
                                        <button class="size-btn ${index === 0 ? 'active' : ''}" onclick="selectSize('${size}', this)">${size}</button>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <button class="btn-primary" onclick="addToCart(${product.id})">Добавить в корзину</button>
                    </div>
                </div>
            `;

            document.getElementById('product-modal').classList.add('open');
        }

        function selectSize(size, btn) {
            currentSelectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            cart.push({
                ...product,
                selectedSize: currentSelectedSize,
                cartId: Date.now()
            });

            updateCart();
            closeModal('product-modal');
            openCartModal();
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCart();
            renderCartItems();
        }

        function updateCart() {
            localStorage.setItem('black_store_cart', JSON.stringify(cart));
            document.getElementById('cart-badge').innerText = cart.length;
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cart-modal').classList.add('open');
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Корзина пуста</p>';
                document.getElementById('cart-total').innerText = 'Итого: 0 ₸';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.title}</div>
                        <div class="cart-item-details">Размер: ${item.selectedSize || 'Стандарт'}</div>
                    </div>
                    <div class="cart-item-price">${item.price.toLocaleString()} ₸</div>
                    <button class="remove-item" onclick="removeFromCart(${item.cartId})"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(div);
            });

            document.getElementById('cart-total').innerText = `Итого: ${total.toLocaleString()} ₸`;
        }

        function checkout() {
            if (cart.length === 0) return alert('Корзина пуста');
            
            let message = "Здравствуйте! Хочу сделать заказ:%0A";
            let total = 0;
            cart.forEach((item, index) => {
                message += `%0A${index + 1}. ${item.title} (Размер: ${item.selectedSize || 'общий'}) — ${item.price.toLocaleString()} ₸`;
                total += item.price;
            });
            message += `%0A%0AИтого: ${total.toLocaleString()} ₸`;

            window.open(`https://t.me/ВАШ_ЮЗЕРНЕЙМ?text=${message}`, '_blank');
        }

        function openAdminModal() {
            const pass = prompt('Введите пароль:');
            if (pass === '1234') {
                document.getElementById('admin-modal').classList.add('open');
            } else if (pass !== null) {
                alert('Неверный пароль');
            }
        }

        function addNewProduct() {
            const title = document.getElementById('admin-title').value.trim();
            const category = document.getElementById('admin-category').value;
            const price = Number(document.getElementById('admin-price').value);
            const sizes = document.getElementById('admin-sizes').value.trim();
            const img = document.getElementById('admin-img').value.trim();
            const desc = document.getElementById('admin-desc').value.trim();

            if (!title || !price || !img) {
                alert('Заполните обязательные поля!');
                return;
            }

            const newProduct = {
                id: Date.now(),
                title,
                category,
                price,
                sizes,
                img,
                desc
            };

            products.unshift(newProduct);
            saveProducts();
            renderProducts(products);
            closeModal('admin-modal');

            document.getElementById('admin-title').value = '';
            document.getElementById('admin-price').value = '';
            document.getElementById('admin-sizes').value = '';
            document.getElementById('admin-img').value = '';
            document.getElementById('admin-desc').value = '';
            
            alert('Товар добавлен!');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }

        renderProducts(products);
        updateCart();
    </script>
</body>
</html>
