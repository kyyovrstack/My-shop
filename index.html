<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK STORE</title>

  <!-- Теги для отображения превью и фото при отправке ссылки -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BLACK STORE">
  <meta property="og:description" content="Российский бренд одежды и обуви BLACK STORE.">
  <meta property="og:image" content="https://kyyovrstack.github.io/My-shop/preview.jpg">
  <meta property="og:url" content="https://kyyovrstack.github.io/My-shop/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0d0e;
      color: #ffffff;
      padding-bottom: 80px;
    }

    header {
      background-color: #161618;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232326;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .cart-btn-header {
      background: #232326;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .product-card {
      background: #161618;
      border-radius: 14px;
      padding: 10px;
      border: 1px solid #232326;
      display: flex;
      flex-direction: column;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      background-color: #232326;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin: 10px 0 4px;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .add-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: auto;
    }

    .cart-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .cart-modal.active {
      display: flex;
    }

    .cart-content {
      background: #161618;
      width: 100%;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }

    .close-cart {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #232326;
    }

    .checkout-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">BLACK STORE</div>
    <button class="cart-btn-header" onclick="toggleCart()">
      🛒 <span id="cart-count">0</span>
    </button>
  </header>

  <div class="container">
    <div class="products-grid" id="products"></div>
  </div>

  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-title">
        <span>Корзина</span>
        <button class="close-cart" onclick="toggleCart()">✕</button>
      </div>
      <div id="cart-list"></div>
      <div style="margin-top: 15px; font-weight: 700;" id="cart-total">Итого: 0 ₽</div>
      <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Худи Black", price: 3900, img: "preview.jpg" },
      { id: 2, name: "Футболка White", price: 1900, img: "preview.jpg" },
      { id: 3, name: "Кроссовки Dark", price: 6900, img: "preview.jpg" },
      { id: 4, name: "Кепка Logo", price: 1500, img: "preview.jpg" }
    ];

    let cart = JSON.parse(localStorage.getItem('cart_items')) || [];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}">
          <div class="product-title">${p.name}</div>
          <div class="product-price">${p.price} ₽</div>
          <button class="add-btn" onclick="addToCart(${p.id})">В корзину</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const p = products.find(prod => prod.id === id);
      cart.push(p);
      updateCart();
    }

    function updateCart() {
      localStorage.setItem('cart_items', JSON.stringify(cart));
      document.getElementById('cart-count').innerText = cart.length;

      const list = document.getElementById('cart-list');
      if (cart.length === 0) {
        list.innerHTML = "<p style='color:#777;'>Корзина пуста</p>";
      } else {
        list.innerHTML = cart.map((item, idx) => `
          <div class="cart-item">
            <div>${item.name} — ${item.price} ₽</div>
            <button onclick="removeItem(${idx})" style="background:none; border:none; color:#ff4444; cursor:pointer;">Удалить</button>
          </div>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = `Итого: ${total} ₽`;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cartModal').classList.toggle('active');
    }

    function checkout() {
      if (cart.length === 0) return alert("Корзина пуста");
      alert("Заказ принят!");
      cart = [];
      updateCart();
      toggleCart();
    }

    renderProducts();
    updateCart();
  </script>
</body>
</html>
