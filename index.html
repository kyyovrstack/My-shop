<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonStore — Интернет-магазин</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --pink: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

    /* --- АНИМАЦИЯ ПРИ ВХОДЕ (INTRO) --- */
    #intro-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #2e1065 50%, #0f172a 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; animation: fadeOut 0.8s ease 2.2s forwards;
    }
    .intro-title {
      font-size: 3rem; font-weight: 800;
      background: linear-gradient(to right, #8b5cf6, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: zoomIn 1.2s ease-out, pulse 1.5s infinite 1.2s;
    }
    .intro-subtitle { color: var(--text-muted); margin-top: 10px; font-size: 1.2rem; opacity: 0; animation: fadeIn 0.8s ease 0.8s forwards; }

    @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* --- HEADER & NAV --- */
    header {
      background-color: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100; padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--pink); text-shadow: 0 0 10px rgba(236,72,153,0.5); }
    .nav-buttons button {
      background: linear-gradient(135deg, var(--accent), var(--pink));
      color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px;
      cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; margin-left: 10px;
    }
    .nav-buttons button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(236,72,153,0.4); }

    /* --- MAIN LAYOUT --- */
    container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; display: block; }
    h2 { margin-bottom: 1.5rem; font-size: 1.8rem; border-left: 4px solid var(--pink); padding-left: 10px; }

    /* --- СЕТКА ТОВАРОВ --- */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; }
    .product-card {
      background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s, box-shadow 0.3s;
      display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(139,92,246,0.2); }
    .product-img { width: 100%; height: 200px; object-fit: cover; background-color: #334155; }
    .product-info { padding: 1.2rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .product-price { font-size: 1.4rem; font-weight: bold; color: var(--pink); margin-bottom: 1rem; }
    .btn-buy {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 0.6rem; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .btn-buy:hover { background: var(--accent-hover); }

    /* --- АДМИН ПАНЕЛЬ --- */
    #admin-panel {
      background: var(--card-bg); padding: 2rem; border-radius: 12px;
      margin-bottom: 3rem; border: 1px solid var(--accent); display: none;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
    .form-group input {
      width: 100%; padding: 0.7rem; border-radius: 6px; border: 1px solid #475569;
      background: #0f172a; color: white;
    }
    .admin-actions { display: flex; gap: 10px; margin-top: 1rem; }
    .btn-save { background: #10b981; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #64748b; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 6px; cursor: pointer; }

    /* Таблица админки */
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    .admin-table th, .admin-table td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #334155; }
    .btn-edit { background: #f59e0b; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Анимированная заставка -->
  <div id="intro-screen">
    <h1 class="intro-title">Добро пожаловать</h1>
    <p class="intro-subtitle">Загрузка вашего нового магазина...</p>
  </div>

  <!-- Шапка сайта -->
  <header>
    <div class="logo">⚡ NeonStore</div>
    <div class="nav-buttons">
      <button onclick="toggleAdmin()">Панель управления</button>
    </div>
  </header>

  <container>
    <!-- Панель администратора -->
    <section id="admin-panel">
      <h2>Управление товарами (Админка)</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-group">
          <label>Название товара</label>
          <input type="text" id="product-title" required placeholder="Например: Беспроводные наушники">
        </div>
        <div class="form-group">
          <label>Цена ($)</label>
          <input type="number" id="product-price" required placeholder="99">
        </div>
        <div class="form-group">
          <label>Ссылка на изображение (URL)</label>
          <input type="url" id="product-img" required placeholder="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
        </div>
        <div class="admin-actions">
          <button type="submit" class="btn-save">Сохранить товар</button>
          <button type="button" class="btn-cancel" onclick="resetForm()">Очистить форму</button>
        </div>
      </form>

      <h3 style="margin-top: 2rem;">Список товаров в базе</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Фото</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </section>

    <!-- Витрина товаров -->
    <section>
      <h2>Каталог товаров</h2>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </container>

  <script>
    // Начальные данные (если базы ещё нет)
    const initialProducts = [
      { id: 1, title: "Игровые Наушники", price: 120, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 2, title: "Смарт-часы", price: 250, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 3, title: "Беспроводная Колонка", price: 85, img: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500" }
    ];

    // Инициализация базы в localStorage
    function getProducts() {
      const stored = localStorage.getItem('neon_products');
      if (!stored) {
        localStorage.setItem('neon_products', JSON.stringify(initialProducts));
        return initialProducts;
      }
      return JSON.parse(stored);
    }

    function saveProducts(products) {
      localStorage.setItem('neon_products', JSON.stringify(products));
      renderCatalog();
      renderAdminTable();
    }

    // Отображение каталога для клиентов
    function renderCatalog() {
      const products = getProducts();
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.img}" alt="${p.title}" class="product-img" onerror="this.src='https://via.placeholder.com/300x200?text=Нет+фото'">
            <div class="product-info">
              <div class="product-title">${p.title}</div>
              <div class="product-price">$${p.price}</div>
              <button class="btn-buy" onclick="alert('Товар \"${p.title}\" добавлен в корзину!')">В корзину</button>
            </div>
          </div>
        `;
      });
    }

    // Отображение таблицы в админке
    function renderAdminTable() {
      const products = getProducts();
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '';

      products.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${p.img}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"></td>
            <td>${p.title}</td>
            <td>$${p.price}</td>
            <td>
              <button class="btn-edit" onclick="editProduct(${p.id})">Ред.</button>
              <button class="btn-delete" onclick="deleteProduct(${p.id})">Уд.</button>
            </td>
          </tr>
        `;
      });
    }

    // Открытие/закрытие админки с паролем
    function toggleAdmin() {
      const panel = document.getElementById('admin-panel');
      if (panel.style.display === 'none' || panel.style.display === '') {
        const password = prompt("Введите пароль для доступа к панели (Пароль: admin123):");
        if (password === "admin123") {
          panel.style.display = 'block';
          renderAdminTable();
          panel.scrollIntoView({ behavior: 'smooth' });
        } else if (password !== null) {
          alert("Неверный пароль!");
        }
      } else {
        panel.style.display = 'none';
      }
    }

    // Добавление и редактирование
    document.getElementById('product-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('product-id').value;
      const title = document.getElementById('product-title').value;
      const price = parseFloat(document.getElementById('product-price').value);
      const img = document.getElementById('product-img').value;

      let products = getProducts();

      if (id) {
        // Редактирование существующего
        products = products.map(p => p.id == id ? { id: Number(id), title, price, img } : p);
      } else {
        // Добавление нового
        const newProduct = { id: Date.now(), title, price, img };
        products.push(newProduct);
      }

      saveProducts(products);
      resetForm();
    });

    function editProduct(id) {
      const products = getProducts();
      const p = products.find(prod => prod.id === id);
      if (p) {
        document.getElementById('product-id').value = p.id;
        document.getElementById('product-title').value = p.title;
        document.getElementById('product-price').value = p.price;
        document.getElementById('product-img').value = p.img;
        window.scrollTo({ top: document.getElementById('admin-panel').offsetTop - 20, behavior: 'smooth' });
      }
    }

    function deleteProduct(id) {
      if (confirm("Вы уверены, что хотите удалить этот товар?")) {
        let products = getProducts();
        products = products.filter(p => p.id !== id);
        saveProducts(products);
      }
    }

    function resetForm() {
      document.getElementById('product-id').value = '';
      document.getElementById('product-form').reset();
    }

    // Запуск при старте
    renderCatalog();
  </script>
</body>
</html>
