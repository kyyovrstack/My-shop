<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK STORE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent: #ffffff;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border-color: #222222;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --gradient-btn: linear-gradient(135deg, #ff416c, #ff4b2b);
            --badge-pink: linear-gradient(135deg, #f72585, #b5179e);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 11, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-decoration: none;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .admin-badge-btn {
            background: var(--badge-pink);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.3);
            transition: opacity 0.2s;
        }

        .admin-badge-btn:hover {
            opacity: 0.9;
        }

        .cart-header-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cart-header-badge {
            background: #ff416c;
            color: white;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 0.75rem;
        }

        .hero-section {
            padding: 40px 5% 20px;
            text-align: center;
            background: radial-gradient(circle at center, #1a1020 0%, var(--bg-color) 70%);
            border-bottom: 1px solid var(--border-color);
        }

        .hero-section h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.4;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            flex: 1;
        }

        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px 12px 40px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-options-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #444;
        }

        .product-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            z-index: 2;
            border: 1px solid var(--border-color);
        }

        .product-fav {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 2;
            transition: color 0.2s;
        }

        .product-fav.active {
            color: #ff416c;
        }

        .product-img-container {
            width: 100%;
            height: 280px;
            background: #151515;
            position: relative;
            cursor: pointer;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            gap: 12px;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .product-bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .btn-card-action {
            width: 100%;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-card-action:hover {
            opacity: 0.9;
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--accent);
        }

        /* Детали товара */
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
            }
        }

        .detail-gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }

        .detail-info h2 {
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .detail-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .detail-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .sizes-container {
            margin-bottom: 20px;
        }

        .sizes-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .sizes-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .size-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .size-btn.active {
            background: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Админ панель */
        .admin-form input, .admin-form textarea, .admin-form select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            outline: none;
        }

        .admin-form label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Корзина */
        .cart-item {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-item-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .cart-item-price {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">BLACK STORE</a>
        <div class="header-actions">
            <button class="cart-header-btn" onclick="openCartModal()">
                <i class="fa-solid fa-bag-shopping"></i> Корзина
                <span class="cart-header-badge" id="cart-badge">0</span>
            </button>
            <button class="admin-badge-btn" onclick="openAdminModal()">Админка</button>
        </div>
    </header>

    <div class="hero-section">
        <h1>Эксклюзивная одежда и обувь</h1>
        <p>Добро пожаловать в BLACK STORE. Стильный премиальный гардероб с доставкой. Листайте ниже и выбирайте лучшие позиции.</p>
    </div>

    <div class="main-container">
        
        <div class="controls-panel">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="search-input" placeholder="Поиск товара по названию..." oninput="filterAndSearchProducts()">
            </div>
            
            <div class="filter-options-row">
                <select class="filter-select" id="sort-select" onchange="filterAndSearchProducts()">
                    <option value="default">Сортировка: По умолчанию</option>
                    <option value="price-asc">Цена: По возрастанию</option>
                    <option value="price-desc">Цена: По убыванию</option>
                </select>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="setCategory('all', this)"><i class="fa-solid fa-border-all"></i> Все товары</button>
                <button class="filter-btn" onclick="setCategory('clothes', this)"><i class="fa-solid fa-shirt"></i> Одежда</button>
                <button class="filter-btn" onclick="setCategory('shoes', this)"><i class="fa-solid fa-shoe-prints"></i> Обувь</button>
                <button class="filter-btn" onclick="setCategory('favorites', this)"><i class="fa-solid fa-heart"></i> Избранное</button>
            </div>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Товары рендерятся через JS -->
        </div>
    </div>

    <!-- Модальное окно товара -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('product-modal')">&times;</button>
            <div id="product-modal-body"></div>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('cart-modal')">&times;</button>
            <h2 style="margin-bottom: 20px;">Корзина</h2>
            <div id="cart-items-container"></div>
            <div id="cart-total" style="font-weight: 700; font-size: 1.1rem; margin: 20px 0;">Итого: 0 ₸</div>
            <button class="btn-primary" onclick="checkout()">Оформить заказ в Telegram</button>
        </div>
    </div>

    <!-- Модальное окно админки -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('admin-modal')">&times;</button>
            <h2 style="margin-bottom: 20px;">Добавить товар</h2>
            <div class="admin-form">
                <label>Название товара</label>
                <input type="text" id="admin-title" placeholder="Худи Ralph Lauren">
                
                <label>Категория</label>
                <select id="admin-category">
                    <option value="clothes">Одежда</option>
                    <option value="shoes">Обувь</option>
                </select>

                <label>Цена (₸)</label>
                <input type="number" id="admin-price" placeholder="5500">

                <label>Размеры (через запятую)</label>
                <input type="text" id="admin-sizes" placeholder="S, M, L, XL">

                <label>Ссылка на фото</label>
                <input type="text" id="admin-img" placeholder="https://...">

                <label>Описание</label>
                <textarea id="admin-desc" rows="3" placeholder="Описание товара..."></textarea>

                <button class="btn-primary" onclick="addNewProduct()">Добавить товар</button>
            </div>
        </div>
    </div>

    <script>
        function getProducts() {
            const stored = localStorage.getItem('black_store_products');
            if (stored) {
                return JSON.parse(stored);
            }
            return [
                {
                    id: 1,
                    title: "Худи Ralph Lauren",
                    category: "clothes",
                    sizes: "S, M, L, XL",
                    price: 5500,
                    desc: "Фирменное худи с вышивкой.",
                    img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&q=80&w=800"
                },
                {
                    id: 2,
                    title: "Кроссовки Adidas City Munchen",
                    category: "shoes",
                    sizes: "41, 42, 43, 44",
                    price: 3100,
                    desc: "Стильные городские кроссовки.",
                    img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=800"
                }
            ];
        }

        let products = getProducts();
        let cart = JSON.parse(localStorage.getItem('black_store_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('black_store_favs')) || [];
        let currentCategory = 'all';
        let currentSelectedSize = '';

        function saveProducts() {
            localStorage.setItem('black_store_products', JSON.stringify(products));
        }

        function renderProducts(items) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);">Товары не найдены</p>';
                return;
            }

            items.forEach(product => {
                const isFav = favorites.includes(product.id);
                const categoryName = product.category === 'clothes' ? 'ОДЕЖДА' : 'ОБУВЬ';

                const card = document.createElement('div');
                card.className = 'product-card';
                
                card.innerHTML = `
                    <div class="product-tag">${categoryName}</div>
                    <div class="product-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${product.id}, event)">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="product-img-container" onclick="openProductModal(${product.id})">
                        <img src="${product.img}" alt="${product.title}" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductModal(${product.id})">${product.title}</div>
                        <div class="product-bottom">
                            <div class="product-price">${product.price.toLocaleString()} ₸</div>
                            <button class="btn-card-action" onclick="openProductModal(${product.id})">В корзину</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;
            filterAndSearchProducts();
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('black_store_favs', JSON.stringify(favorites));
            filterAndSearchProducts();
        }

        function filterAndSearchProducts() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const sortOrder = document.getElementById('sort-select').value;

            let result = [...products];

            if (currentCategory === 'favorites') {
                result = result.filter(p => favorites.includes(p.id));
            } else if (currentCategory !== 'all') {
                result = result.filter(p => p.category === currentCategory);
            }

            if (searchQuery) {
                result = result.filter(p => p.title.toLowerCase().includes(searchQuery));
            }

            if (sortOrder === 'price-asc') {
                result.sort((a, b) => a.price - b.price);
            } else if (sortOrder === 'price-desc') {
                result.sort((a, b) => b.price - a.price);
            }

            renderProducts(result);
        }

        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const sizesArray = product.sizes ? product.sizes.split(',').map(s => s.trim()) : [];
            currentSelectedSize = sizesArray[0] || '';

            const body = document.getElementById('product-modal-body');
            body.innerHTML = `
                <div class="product-detail-grid">
                    <div class="detail-gallery">
                        <img src="${product.img}" alt="${product.title}">
                    </div>
                    <div class="detail-info">
                        <h2>${product.title}</h2>
                        <div class="detail-price">${product.price.toLocaleString()} ₸</div>
                        <div class="detail-desc">${product.desc || ''}</div>
                        
                        ${sizesArray.length > 0 ? `
                            <div class="sizes-container">
                                <div class="sizes-title">Выберите размер:</div>
                                <div class="sizes-list">
                                    ${sizesArray.map((size, index) => `
                                        <button class="size-btn ${index === 0 ? 'active' : ''}" onclick="selectSize('${size}', this)">${size}</button>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <button class="btn-primary" onclick="addToCart(${product.id})">Добавить в корзину</button>
                    </div>
                </div>
            `;

            document.getElementById('product-modal').classList.add('open');
        }

        function selectSize(size, btn) {
            currentSelectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            cart.push({
                ...product,
                selectedSize: currentSelectedSize,
                cartId: Date.now()
            });

            updateCart();
            closeModal('product-modal');
            openCartModal();
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCart();
            renderCartItems();
        }

        function updateCart() {
            localStorage.setItem('black_store_cart', JSON.stringify(cart));
            document.getElementById('cart-badge').innerText = cart.length;
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cart-modal').classList.add('open');
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Корзина пуста</p>';
                document.getElementById('cart-total').innerText = 'Итого: 0 ₸';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.title}</div>
                        <div class="cart-item-details">Размер: ${item.selectedSize || 'Стандарт'}</div>
                    </div>
                    <div class="cart-item-price">${item.price.toLocaleString()} ₸</div>
                    <button class="remove-item" onclick="removeFromCart(${item.cartId})"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(div);
            });

            document.getElementById('cart-total').innerText = `Итого: ${total.toLocaleString()} ₸`;
        }

        function checkout() {
            if (cart.length === 0) return alert('Корзина пуста');
            
            let message = "Здравствуйте! Хочу сделать заказ:%0A";
            let total = 0;
            cart.forEach((item, index) => {
                message += `%0A${index + 1}. ${item.title} (Размер: ${item.selectedSize || 'общий'}) — ${item.price.toLocaleString()} ₸`;
                total += item.price;
            });
            message += `%0A%0AИтого: ${total.toLocaleString()} ₸`;

            window.open(`https://t.me/ВАШ_ЮЗЕРНЕЙМ?text=${message}`, '_blank');
        }

        function openAdminModal() {
            const pass = prompt('Введите пароль:');
            if (pass === '1234') {
                document.getElementById('admin-modal').classList.add('open');
            } else if (pass !== null) {
                alert('Неверный пароль');
            }
        }

        function addNewProduct() {
            const title = document.getElementById('admin-title').value.trim();
            const category = document.getElementById('admin-category').value;
            const price = Number(document.getElementById('admin-price').value);
            const sizes = document.getElementById('admin-sizes').value.trim();
            const img = document.getElementById('admin-img').value.trim();
            const desc = document.getElementById('admin-desc').value.trim();

            if (!title || !price || !img) {
                alert('Заполните обязательные поля!');
                return;
            }

            const newProduct = {
                id: Date.now(),
                title,
                category,
                price,
                sizes,
                img,
                desc
            };

            products.unshift(newProduct);
            saveProducts();
            filterAndSearchProducts();
            closeModal('admin-modal');

            document.getElementById('admin-title').value = '';
            document.getElementById('admin-price').value = '';
            document.getElementById('admin-sizes').value = '';
            document.getElementById('admin-img').value = '';
            document.getElementById('admin-desc').value = '';
            
            alert('Товар добавлен!');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }

        filterAndSearchProducts();
        updateCart();
    </script>
</body>
</html>
