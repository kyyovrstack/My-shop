<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK STORE — Одежда & Обувь</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --pink: #ec4899;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --border: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

    /* --- АНИМАЦИЯ ПРИ ВХОДЕ (INTRO) --- */
    #intro-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; animation: fadeOut 0.6s ease 2s forwards;
    }
    .intro-title {
      font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
      background: linear-gradient(to right, #ffffff, #a855f7, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .intro-subtitle { color: var(--text-muted); margin-top: 8px; font-size: 0.9rem; letter-spacing: 2px; opacity: 0; animation: fadeIn 0.6s ease 0.6s forwards; }

    @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    /* --- HEADER --- */
    header {
      background-color: rgba(9, 9, 11, 0.85); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100; padding: 0.8rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
    .logo span { color: var(--pink); }
    .nav-buttons button {
      background: linear-gradient(135deg, var(--accent), var(--pink));
      color: white; border: none; padding: 0.5rem 0.9rem; border-radius: 20px;
      cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.2s;
    }

    /* --- MAIN LAYOUT --- */
    .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 0.8rem; }

    /* --- ФИЛЬТР КАТЕГОРИЙ --- */
    .categories-nav {
      display: flex; gap: 8px; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 5px;
    }
    .cat-btn {
      background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border);
      padding: 0.5rem 1.2rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; whitespace: nowrap;
    }
    .cat-btn.active, .cat-btn:hover {
      background: #ffffff; color: #000000; border-color: #ffffff;
    }

    /* --- СЕТКА ТОВАРОВ (2 колонки на мобильных) --- */
    .product-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
    }
    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    }

    .product-card {
      background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); transition: transform 0.2s, border-color 0.2s;
      display: flex; flex-direction: column; position: relative;
    }
    .product-card:active, .product-card:hover { 
      transform: translateY(-3px); border-color: rgba(168, 85, 247, 0.4); 
    }
    
    .product-badge {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase;
    }

    .product-img { width: 100%; height: 160px; object-fit: cover; background-color: #18181b; }
    @media (min-width: 768px) { .product-img { height: 220px; } }

    .product-info { padding: 0.8rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: #f4f4f5; line-height: 1.2; }
    .product-price { font-size: 1rem; font-weight: 800; color: #fff; margin-bottom: 0.6rem; }
    
    .btn-buy {
      width: 100%; background: #ffffff; color: #000000; border: none;
      padding: 0.5rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: var(--pink); color: #fff; }

    /* --- МОДАЛЬНОЕ ОКНО ПАРОЛЯ --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem;
    }
    .modal-card {
      background: var(--card-bg); padding: 1.5rem; border-radius: 16px;
      border: 1px solid var(--border); width: 100%; max-width: 320px; text-align: center;
    }
    .modal-card h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .modal-card input {
      width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid var(--border);
      background: #000; color: white; margin-bottom: 1rem; text-align: center;
    }

    /* --- АДМИН ПАНЕЛЬ --- */
    #admin-panel {
      background: var(--card-bg); padding: 1.2rem; border-radius: 16px;
      margin-bottom: 2rem; border: 1px solid var(--accent); display: none;
    }
    #admin-panel h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--pink); }
    
    .form-group { margin-bottom: 0.8rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; color: var(--text-muted); font-size: 0.8rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border);
      background: #000000; color: white; font-size: 0.9rem;
    }
    .preview-container { margin-top: 8px; display: none; }
    .preview-container img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }

    .admin-actions { display: flex; gap: 8px; margin-top: 1rem; }
    .btn-save { background: #10b981; color: white; border: none; padding: 0.6rem; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; font-size: 0.85rem; }
    .btn-cancel { background: #3f3f46; color: white; border: none; padding: 0.6rem; border-radius: 8px; cursor: pointer; flex: 1; font-size: 0.85rem; }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.8rem; }
    .admin-table th, .admin-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    .btn-edit { background: #f59e0b; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Анимированная заставка -->
  <div id="intro-screen">
    <h1 class="intro-title">BLACK STORE</h1>
    <p class="intro-subtitle">CLOTHING & FOOTWEAR</p>
  </div>

  <!-- Шапка -->
  <header>
    <div class="logo">BLACK<span>STORE</span></div>
    <div class="nav-buttons">
      <button onclick="openPasswordModal()">Админка</button>
    </div>
  </header>

  <!-- Модалка пароля -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-card">
      <h3>Вход для админа</h3>
      <input type="password" id="adminPasswordInput" placeholder="Пароль">
      <div class="admin-actions">
        <button class="btn-save" onclick="checkPassword()">Войти</button>
        <button class="btn-cancel" onclick="closePasswordModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Админка -->
    <section id="admin-panel">
      <h2>Панель администратора</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-group">
          <label>Название товара</label>
          <input type="text" id="product-title" required placeholder="Напр: Худи Oversize">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="product-category">
            <option value="clothes">Одежда</option>
            <option value="shoes">Обувь</option>
          </select>
        </div>
        <div class="form-group">
          <label>Цена (₽)</label>
          <input type="number" id="product-price" required placeholder="4500">
        </div>
        <div class="form-group">
          <label>Фотография из галереи</label>
          <input type="file" id="product-file" accept="image/*">
          <div class="preview-container" id="preview-box">
            <img id="img-preview" src="" alt="Превью">
          </div>
        </div>
        <div class="admin-actions">
          <button type="submit" class="btn-save">Сохранить</button>
          <button type="button" class="btn-cancel" onclick="resetForm()">Сброс</button>
        </div>
      </form>

      <h3 style="margin-top: 1.5rem; font-size: 1rem;">Список товаров</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Фото</th>
            <th>Имя</th>
            <th>Кат.</th>
            <th>Цена</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </section>

    <!-- Фильтры категорий -->
    <div class="categories-nav">
      <button class="cat-btn active" onclick="filterCategory('all', this)">Все товары</button>
      <button class="cat-btn" onclick="filterCategory('clothes', this)">👕 Одежда</button>
      <button class="cat-btn" onclick="filterCategory('shoes', this)">👟 Обувь</button>
    </div>

    <!-- Витрина -->
    <section>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </div>

  <script>
    let currentImageBase64 = '';
    let currentCategoryFilter = 'all';

    function getProducts() {
      const stored = localStorage.getItem('black_store_products');
      return stored ? JSON.parse(stored) : [];
    }

    function saveProducts(products) {
      try {
        localStorage.setItem('black_store_products', JSON.stringify(products));
        renderCatalog();
        renderAdminTable();
      } catch (e) {
        alert("Ошибка: картинка слишком большая!");
      }
    }

    // Авторизация (Пароль: adminsh)
    function openPasswordModal() {
      const panel = document.getElementById('admin-panel');
      if (panel.style.display === 'block') {
        panel.style.display = 'none';
      } else {
        document.getElementById('passwordModal').style.display = 'flex';
        document.getElementById('adminPasswordInput').value = '';
        document.getElementById('adminPasswordInput').focus();
      }
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').style.display = 'none';
    }

    function checkPassword() {
      if (document.getElementById('adminPasswordInput').value === "adminsh") {
        closePasswordModal();
        const panel = document.getElementById('admin-panel');
        panel.style.display = 'block';
        renderAdminTable();
        panel.scrollIntoView({ behavior: 'smooth' });
      } else {
        alert("Неверный пароль!");
      }
    }

    document.getElementById('adminPasswordInput').addEventListener('keyup', e => { if (e.key === 'Enter') checkPassword(); });

    // Загрузка фото из галереи
    document.getElementById('product-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          currentImageBase64 = event.target.result;
          document.getElementById('img-preview').src = currentImageBase64;
          document.getElementById('preview-box').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Фильтрация
    function filterCategory(cat, btn) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    // Отрисовка витрины
    function renderCatalog() {
      const products = getProducts();
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      const filtered = currentCategoryFilter === 'all' 
        ? products 
        : products.filter(p => p.category === currentCategoryFilter);

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 2rem 0;">Товаров в этой категории пока нет</p>';
        return;
      }

      filtered.forEach(p => {
        const catLabel = p.category === 'clothes' ? 'Одежда' : 'Обувь';
        grid.innerHTML += `
          <div class="product-card">
            <span class="product-badge">${catLabel}</span>
            <img src="${p.img || 'https://via.placeholder.com/200'}" alt="${p.title}" class="product-img">
            <div class="product-info">
              <div>
                <div class="product-title">${p.title}</div>
                <div class="product-price">${p.price} ₽</div>
              </div>
              <button class="btn-buy" onclick="alert('Добавлено в корзину!')">В корзину</button>
            </div>
          </div>
        `;
      });
    }

    // Таблица админки
    function renderAdminTable() {
      const products = getProducts();
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '';

      products.forEach(p => {
        const catLabel = p.category === 'clothes' ? 'Одежда' : 'Обувь';
        tbody.innerHTML += `
          <tr>
            <td><img src="${p.img}" style="width: 30px; height: 30px; object-fit: cover; border-radius: 4px;"></td>
            <td>${p.title}</td>
            <td>${catLabel}</td>
            <td>${p.price} ₽</td>
            <td>
              <button class="btn-edit" onclick="editProduct(${p.id})">✎</button>
              <button class="btn-delete" onclick="deleteProduct(${p.id})">✕</button>
            </td>
          </tr>
        `;
      });
    }

    // Добавление / Редактирование
    document.getElementById('product-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('product-id').value;
      const title = document.getElementById('product-title').value;
      const category = document.getElementById('product-category').value;
      const price = parseFloat(document.getElementById('product-price').value);

      let products = getProducts();

      if (id) {
        products = products.map(p => p.id == id ? { id: Number(id), title, category, price, img: currentImageBase64 || p.img } : p);
      } else {
        if (!currentImageBase64) {
          alert("Выберите изображение!");
          return;
        }
        products.push({ id: Date.now(), title, category, price, img: currentImageBase64 });
      }

      saveProducts(products);
      resetForm();
    });

    function editProduct(id) {
      const p = getProducts().find(prod => prod.id === id);
      if (p) {
        document.getElementById('product-id').value = p.id;
        document.getElementById('product-title').value = p.title;
        document.getElementById('product-category').value = p.category || 'clothes';
        document.getElementById('product-price').value = p.price;
        currentImageBase64 = p.img;
        document.getElementById('img-preview').src = p.img;
        document.getElementById('preview-box').style.display = 'block';
        window.scrollTo({ top: document.getElementById('admin-panel').offsetTop - 20, behavior: 'smooth' });
      }
    }

    function deleteProduct(id) {
      if (confirm("Удалить товар?")) {
        saveProducts(getProducts().filter(p => p.id !== id));
      }
    }

    function resetForm() {
      document.getElementById('product-id').value = '';
      document.getElementById('product-form').reset();
      document.getElementById('preview-box').style.display = 'none';
      currentImageBase64 = '';
    }

    renderCatalog();
  </script>
</body>
</html>
