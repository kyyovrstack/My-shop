<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK STORE — Одежда & Обувь</title>

  <!-- Open Graph / Превью для мессенджеров (Telegram, WhatsApp, VK) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BLACK STORE">
  <meta property="og:description" content="Российский бренд одежды и обуви BLACK STORE. Каталог с быстрой доставкой.">
  <meta property="og:image" content="https://kyyovrstack.github.io/My-shop/preview.jpg">
  <meta property="og:url" content="https://kyyovrstack.github.io/My-shop/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #f5f5f5;
      padding-bottom: 60px;
    }

    header {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      letter-spacing: 2px;
      font-size: 24px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-title {
      font-size: 16px;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    .product-price {
      color: #4CAF50;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #ddd;
    }

    /* Корзина */
    .cart-section {
      margin-top: 40px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .cart-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>BLACK STORE</h1>
  </header>

  <div class="container">
    <h2>Каталог товаров</h2>
    <br>
    <div class="products-grid" id="products"></div>

    <div class="cart-section">
      <h2>Корзина</h2>
      <div id="cart-items"></div>
      <div class="cart-total" id="cart-total">Итого: 0 ₽</div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Худи Oversize Black", price: 3500, img: "preview.jpg" },
      { id: 2, name: "Футболка Basic White", price: 1800, img: "preview.jpg" },
      { id: 3, name: "Кроссовки Street Vision", price: 6500, img: "preview.jpg" }
    ];

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name}">
          <div class="product-title">${p.name}</div>
          <div class="product-price">${p.price} ₽</div>
          <button class="btn" onclick="addToCart(${p.id})">В корзину</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      saveAndRenderCart();
    }

    function saveAndRenderCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
      const cartContainer = document.getElementById('cart-items');
      const totalContainer = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartContainer.innerHTML = "<p style='color:#888; margin-top:10px;'>Корзина пуста</p>";
        totalContainer.innerText = "Итого: 0 ₽";
        return;
      }

      cartContainer.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>${item.price} ₽</span>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      totalContainer.innerText = `Итого: ${total} ₽`;
    }

    renderProducts();
    saveAndRenderCart();
  </script>

</body>
</html>
