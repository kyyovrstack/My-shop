<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK STORE — Магазин одежды</title>

  <!-- Open Graph / Превью для мессенджеров -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BLACK STORE">
  <meta property="og:description" content="Российский бренд одежды и обуви BLACK STORE. Каталог с быстрой доставкой.">
  <meta property="og:image" content="https://kyyovrstack.github.io/My-shop/preview.jpg">
  <meta property="og:url" content="https://kyyovrstack.github.io/My-shop/">

  <style>
    /* CSS-стили сайта */
    :root {
      --bg-color: #0b0b0c;
      --card-bg: #141416;
      --text-color: #ffffff;
      --text-secondary: #8a8a93;
      --accent-color: #ffffff;
      --accent-bg: #222225;
      --border-color: #222225;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 100px;
    }

    header {
      background-color: rgba(11, 11, 12, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .cart-icon-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 20px;
      cursor: pointer;
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background-color: #fff;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 15px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .category-btn {
      background: var(--accent-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
    }

    .category-btn.active {
      background: #fff;
      color: #000;
      font-weight: 600;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background-color: #1a1a1d;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 16px;
      font-weight: 700;
      margin-top: auto;
      margin-bottom: 10px;
    }

    .add-btn {
      background: var(--accent-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
    }

    /* Модальное окно корзины */
    .cart-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      justify-content: flex-end;
      flex-direction: column;
    }

    .cart-modal.open { display: flex; }

    .cart-content {
      background: var(--card-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 24px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .checkout-btn {
      background: #fff;
      color: #000;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">BLACK STORE</div>
    <button class="cart-icon-btn" onclick="toggleCart()">
      🛒
      <div class="cart-badge" id="cart-count">0</div>
    </button>
  </header>

  <div class="container">
    <div class="categories">
      <button class="category-btn active">Всё</button>
      <button class="category-btn">Одежда</button>
      <button class="category-btn">Обувь</button>
      <button class="category-btn">Аксессуары</button>
    </div>

    <div class="products-grid" id="products-list"></div>
  </div>

  <!-- Корзина -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h2>Корзина</h2>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>
      <div id="cart-items"></div>
      <div style="margin-top: 20px; font-weight: bold; font-size: 18px;" id="cart-total">Итого: 0 ₽</div>
      <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Худи Black Style", price: 3900, img: "preview.jpg" },
      { id: 2, name: "Футболка Oversize", price: 1900, img: "preview.jpg" },
      { id: 3, name: "Кроссовки Dark", price: 6900, img: "preview.jpg" },
      { id: 4, name: "Кепка Minimal", price: 1500, img: "preview.jpg" }
    ];

    let cart = JSON.parse(localStorage.getItem('my_shop_cart')) || [];

    function renderProducts() {
      const list = document.getElementById('products-list');
      list.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">${p.price} ₽</div>
            <button class="add-btn" onclick="addToCart(${p.id})">В корзину</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      updateCart();
    }

    function updateCart() {
      localStorage.setItem('my_shop_cart', JSON.stringify(cart));
      document.getElementById('cart-count').innerText = cart.length;

      const itemsContainer = document.getElementById('cart-items');
      if (cart.length === 0) {
        itemsContainer.innerHTML = "<p style='color: var(--text-secondary);'>Корзина пуста</p>";
      } else {
        itemsContainer.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <div>
              <div style="font-weight: 600;">${item.name}</div>
              <div style="color: var(--text-secondary); font-size: 14px;">${item.price} ₽</div>
            </div>
            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">Удалить</button>
          </div>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = `Итого: ${total} ₽`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('open');
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Корзина пуста!");
        return;
      }
      alert("Спасибо за заказ! Функция отправки заказа будет подключена в ближайшее время.");
      cart = [];
      updateCart();
      toggleCart();
    }

    renderProducts();
    updateCart();
  </script>
</body>
</html>
