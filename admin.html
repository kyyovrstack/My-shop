<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель</title>
  
  <!-- Консоль отладки Eruda -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 40px auto; background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; }
    h2 { color: #58a6ff; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #8b949e; }
    input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #2ea04380; cursor: not-allowed; }
    .hidden { display: none !important; }
    .error { color: #f85149; font-size: 14px; margin-top: 8px; text-align: center; }
    .success { color: #3fb950; font-size: 14px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Блок авторизации -->
    <div id="auth-block">
      <h2>Вход в админку</h2>
      <div class="form-group">
        <label for="password">Введите пароль:</label>
        <input type="password" id="password" placeholder="Пароль">
      </div>
      <button id="login-btn">Войти</button>
      <div id="auth-error" class="error"></div>
    </div>

    <!-- Блок добавления товара -->
    <div id="admin-panel" class="hidden">
      <h2>Добавить товар</h2>
      <form id="add-product-form">
        <div class="form-group">
          <label for="title">Название товара</label>
          <input type="text" id="title" required placeholder="Например: Кроссовки">
        </div>
        <div class="form-group">
          <label for="price">Цена</label>
          <input type="text" id="price" required placeholder="Например: 4500 ₽">
        </div>
        <div class="form-group">
          <label for="image">Изображение</label>
          <input type="file" id="image" accept="image/*" required>
        </div>
        <button type="submit" id="submit-btn">Опубликовать товар</button>
      </form>
      <div id="status-msg"></div>
    </div>
  </div>

  <script>
    // @ts-nocheck
    const SUPABASE_URL = "https://gokwvpvsqaqzfhfbxst.supabase.co";
    const SUPABASE_ANON_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdva3d2cHZzcWFxemZqaGZieHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTAwODksImV4cCI6MjEwNTU4NjA4OX0.OedT8mYq_yyf9vs_qqYOLsPW9LaHqnKY3Zi42ZAWQz8";

    // Инициализация с безопасной проверкой переменной
    var dbClient = window.dbClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Логика авторизации
    document.getElementById('login-btn').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const authError = document.getElementById('auth-error');
      
      const enteredPassword = passwordInput.value ? passwordInput.value.trim() : '';

      if (enteredPassword === 'admin') {
        document.getElementById('auth-block').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
      } else {
        authError.innerText = 'Неверный пароль!';
      }
    });

    // Логика добавления товара
    document.getElementById('add-product-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-msg');
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const fileInput = document.getElementById('image');
      const file = fileInput.files[0];

      if (!file) {
        statusMsg.className = 'error';
        statusMsg.innerText = 'Выберите изображение!';
        return;
      }

      submitBtn.disabled = true;
      statusMsg.className = 'success';
      statusMsg.innerText = 'Загрузка изображения...';

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;

        const { data: uploadData, error: uploadError } = await dbClient
          .storage
          .from('products')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = dbClient
          .storage
          .from('products')
          .getPublicUrl(fileName);

        const imageUrl = urlData.publicUrl;

        statusMsg.innerText = 'Сохранение товара...';

        const { error: dbError } = await dbClient
          .from('products')
          .insert([{ title: title, price: price, image_url: imageUrl }]);

        if (dbError) throw dbError;

        statusMsg.className = 'success';
        statusMsg.innerText = 'Товар успешно добавлен!';
        document.getElementById('add-product-form').reset();

      } catch (err) {
        console.error(err);
        statusMsg.className = 'error';
        statusMsg.innerText = 'Ошибка: ' + (err.message || 'Не удалось сохранить');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
